name: Budowanie i paczki testowe
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia zgodne z Bookworm
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git g++ cmake ninja-build pkg-config libjack-jackd2-dev jackd2 python3 ca-certificates nodejs dbus-daemon
      - name: Kompilacja i testy DSP
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SKIP_RPATH=ON
          cmake --build build --parallel 2
          python3 tools/ci_run.py docs/BUILD-TESTS.log ctest --test-dir build --output-on-failure
          python3 tests/certify_originals.py --build build
          ./build/module-tests ./build/modules > docs/DSP-TESTS.log
      - name: JACK, HTTP, presety, paczki i rollback z błędem
        env:
          JERZY_TEST_BUILD: ${{ github.workspace }}/build
        run: |
          python3 tools/ci_run.py docs/INTEGRATION-TESTS.log python3 tests/integration.py --build build --stress-seconds 15
          python3 tools/ci_run.py docs/PACKAGE-TESTS.log python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --check web-ui/app.js
          node --check web-ui/hardware.js
          python3 tools/optimize_pro.py --check
          python3 tools/optimize_muff.py --check
          sh -n deploy/raspberry-pi/install.sh
      - name: Budowanie rzeczywistych paczek
        run: python3 tools/ci_run.py docs/PACKAGE-BUILD.log python3 tools/package.py --build build --out dist --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: JerzyAudioPlatform-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parser skryptów Windows
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; $failed = $true }
          }
          if ($failed) { exit 1 }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, powershell]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JerzyAudioPlatform-arm64
          path: release
      - name: Publikacja wyłącznie jako prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "Jerzy Audio Platform — wersja testowa $RELEASE_TAG" --notes-file release/RELEASE-NOTES.md
